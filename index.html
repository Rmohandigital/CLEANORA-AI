<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CleanMark AI</title>
    <meta name="description" content="AI-powered watermark, logo, text, and object removal for images and videos with chunked large-file upload support up to 2 GB." />
    <meta property="og:title" content="CleanMark AI" />
    <meta property="og:description" content="AI-powered watermark, logo, text, and object removal for images and videos with chunked large-file upload support up to 2 GB." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Gracefully prevent unhandled WebSocket closure errors in AI Studio iframe environment
      window.addEventListener('unhandledrejection', function (event) {
        if (event.reason && (String(event.reason).includes('WebSocket') || String(event.reason?.message).includes('WebSocket'))) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        if (event.message && String(event.message).includes('WebSocket')) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-black text-white antialiased selection:bg-white selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
